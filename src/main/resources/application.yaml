spring:
  application:
    name: Config-Server
  cloud:
    config:
      server:
        git:
          default-label: main
          uri: https://github.com/Roberth1982Trujillo/Configuration-Clients.git
          skipSsValidation: true
          clone-on-start: true

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/